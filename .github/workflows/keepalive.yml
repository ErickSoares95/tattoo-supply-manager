name: Keep Render awake

# Render's free tier sleeps after ~15 min without traffic and takes 30-50s to wake up,
# which makes the storefront's first catalog load fail. Pinging the health endpoint every
# 10 minutes keeps it warm (one service running 24/7 fits the free tier's monthly hours).
# GitHub may delay scheduled runs and disables them after 60 days without repo activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /actuator/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://tattoo-supply-manager.onrender.com/actuator/health
