# ClusterIP by default - in a real cluster this would sit behind an Ingress. For local
# testing (no cloud LoadBalancer available), reach it via:
#   kubectl port-forward -n tattoo-supply-manager svc/app 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tattoo-supply-manager
spec:
  selector:
    app: tattoo-supply-manager
  ports:
    - port: 8080
      targetPort: 8080
