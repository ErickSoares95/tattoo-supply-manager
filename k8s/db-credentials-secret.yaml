# Same dev placeholder credentials already committed in docker/docker-compose.yml -
# putting them in a Secret here isn't leaking anything new. In a real environment
# these would come from something external (Sealed Secrets, cloud secret manager,
# CI-injected value), never committed as plain stringData like this.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tattoo-supply-manager
type: Opaque
stringData:
  POSTGRES_DB: tattoo-supply-manager-db
  POSTGRES_USER: tattoo_user
  POSTGRES_PASSWORD: tattoo_pass
