# Test-wide overrides (merged with src/main/resources/application.yaml).
# Park the scheduled notification retry job in every cached Spring test context: tests drive the
# reprocess services explicitly, and a job of another cached context must not race with them.
notification.retry.fixed-delay-ms=3600000
notification.retry.initial-delay-ms=3600000
# Same for the unpaid-order expiration job (order.OrderExpirationJob): tests call it directly.
order.expiration.fixed-delay-ms=3600000
order.expiration.initial-delay-ms=3600000
# O2 regression test counts SQL statements.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
