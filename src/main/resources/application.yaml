server:
  port: ${PORT:8080}

spring:
  application:
    name: tattoo-supply-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tattoo-supply-manager-db}
    username: ${SPRING_DATASOURCE_USERNAME:tattoo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tattoo_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:1b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Local docker-compose broker is plaintext; a managed broker (Redpanda Serverless)
    # needs SASL_SSL + SCRAM. All env-driven so local/CI keep the plaintext defaults.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:GSSAPI}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      # Wrapped in ErrorHandlingDeserializer: a raw JsonDeserializer failure (malformed
      # message, missing type header) would otherwise bypass DefaultErrorHandler entirely
      # and get stuck retrying the same offset forever instead of reaching the DLT.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ericksoares.tattoo.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Transactional outbox relay (shared.outbox.OutboxPoller)
outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
  batch-size: ${OUTBOX_BATCH_SIZE:100}
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-isso}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true