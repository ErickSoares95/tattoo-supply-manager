server:
  port: ${PORT:8080}

spring:
  application:
    name: tattoo-supply-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tattoo-supply-manager-db}
    username: ${SPRING_DATASOURCE_USERNAME:tattoo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tattoo_pass}
  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the
  # entities. Databases created before Flyway (ddl-auto=update era) are baselined at V1, so only
  # V2+ run on them.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    # SQL logging is noisy and slow in production; turn it on locally with JPA_SHOW_SQL=true.
    show-sql: ${JPA_SHOW_SQL:false}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:1b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-isso}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # /actuator/health/liveness and /readiness (k8s probes, I4). Readiness also checks the DB.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true
# Scheduled retry of failed order/payment notifications (notification.NotificationRetryJob)
notification:
  retry:
    fixed-delay-ms: ${NOTIFICATION_RETRY_FIXED_DELAY_MS:30000}
    initial-delay-ms: ${NOTIFICATION_RETRY_INITIAL_DELAY_MS:30000}
  # Max time a real sender may take per call; must fit in the 2-min resend lease (checked at boot)
  sender:
    timeout: ${NOTIFICATION_SENDER_TIMEOUT:30s}
# Unpaid orders are cancelled (stock given back) after this many hours (order.OrderExpirationJob)
order:
  expiration:
    hours: ${ORDER_EXPIRATION_HOURS:48}
