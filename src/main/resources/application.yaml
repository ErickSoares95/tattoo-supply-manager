server:
  port: ${PORT:8080}

spring:
  application:
    name: tattoo-supply-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tattoo-supply-manager-db}
    username: ${SPRING_DATASOURCE_USERNAME:tattoo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tattoo_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:1b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-isso}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true