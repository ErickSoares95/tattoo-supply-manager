server:
  port: ${PORT:8080}

spring:
  application:
    name: tattoo-supply-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tattoo-supply-manager-db}
    username: ${SPRING_DATASOURCE_USERNAME:tattoo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tattoo_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-troque-isso}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    web:
      server:
        request:
          autotime:
            enabled: true