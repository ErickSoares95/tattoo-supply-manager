services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: tattoo-supply-manager-postgres
    restart: always
    environment:
      POSTGRES_DB: tattoo-supply-manager-db
      POSTGRES_USER: tattoo_user
      POSTGRES_PASSWORD: tattoo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tattoo_user -d tattoo-supply-manager-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tattoo-supply-manager-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  kafka:
    image: apache/kafka:3.8.0
    container_name: tattoo-supply-manager-kafka
    restart: always
    ports:
      # Porta pra acesso de fora do compose (ex: rodando a app local via mvnw)
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT: rede interna do compose (hostname "kafka"). PLAINTEXT_HOST: acesso via localhost, de fora do compose.
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tattoo-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Injeta no application.yml a URL apontando para o container "postgres"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tattoo-supply-manager-db
      SPRING_DATASOURCE_USERNAME: tattoo_user
      SPRING_DATASOURCE_PASSWORD: tattoo_pass
      JWT_SECRET: local-dev-jwt-secret-troque-em-producao-32chars+
      OLLAMA_BASE_URL: http://ollama:11434
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  prometheus:
    image: prom/prometheus:latest
    container_name: tattoo-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: tattoo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  ollama_data: